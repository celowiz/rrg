name: Dados + Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"   # 19:30 BRT, após o fechamento da B3 e de NY
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements.txt
      - name: Testes (Python + paridade JS)
        run: |
          python -m pytest -q tests
          node tests/rrg.test.mjs
      - name: Baixar dados
        run: python scripts/fetch_data.py _site/data
      - name: Montar site
        run: |
          cp -r index.html css js og.png favicon.svg favicon-32.png favicon.ico apple-touch-icon.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
